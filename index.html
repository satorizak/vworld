<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Virtual World</title>
<style>
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  p { color: #aaa; font-size: 14px; margin: 4px 0; }
  .spinner { width: 40px; height: 40px; border: 4px solid #444; border-top-color: #7a8fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #7a8fff; }
  #status { margin-top: 16px; font-size: 13px; color: #aaa; }
</style>
</head>
<body>
<div class="spinner"></div>
<h1>🌍 3D Virtual World</h1>
<p>Connecting you to the world...</p>
<div id="status">Loading...</div>

<script>
async function redirect() {
  const status = document.getElementById('status');
  try {
    const res = await fetch('https://raw.githubusercontent.com/satorizak/vworld/main/world-url.json?nocache=' + Date.now());
    if (!res.ok) throw new Error('Could not fetch world URL');
    const data = await res.json();
    if (data.url) {
      status.innerHTML = 'Found! Taking you to the world...';
      window.location.href = data.url + '/1uworld/';
    } else {
      throw new Error('No URL in file');
    }
  } catch(e) {
    status.innerHTML = 'The world server is currently offline. Please try again later or contact the administrator.';
  }
}
redirect();
</script>
</body>
</html>
